name: Package VSIX

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package extension
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: vision-night-vsix
          path: "*.vsix"
          if-no-files-found: error
